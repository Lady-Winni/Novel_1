<div class="partlabel">《兩個盒子》</div><h1 class="ch">主要登場人物</h1><div class="text">
<p class="gl"><b>望月結衣：</b>港門銀行金融犯罪合規部（FCC）的行員。</p>
<p class="gl"><b>東雲聰一：</b>大學醫院形成外科的醫師，世田谷東雲醫院院長的兒子。</p>
<h2 class="part">東雲家</h2>
<p class="gl"><b>院長：</b>聰一的父親，東雲醫院的院長。</p>
<p class="gl"><b>東雲夫人：</b>聰一的母親。</p>
<p class="gl"><b>老護理長：</b>東雲醫院的老護理長。</p>
<p class="gl"><b>綾瀨真璃亞：</b>聰一的青梅竹馬，家裡也是開醫院的。</p>
